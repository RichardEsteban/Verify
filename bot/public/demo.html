<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c3b2b" />
<title>Verify — probar el bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light dark;
    --forest-900: #072a1e;
    --forest-800: #0a3326;
    --forest-700: #0c3b2b;
    --forest-600: #0f4a36;
    --lime: #c6f432;
    --page: #eef3ef;
    --chat: #e8efe8;
    --surface: #ffffff;
    --ink: #0a2a1e;
    --muted: #54695f;
    --faint: #8a9b92;
    --line: #dfe8e2;
    --bubble-bot: #ffffff;
    --bubble-user: #c6f432;
    --danger-bg: #fdecea;
    --danger-ink: #8a1c1c;
    --link: #0f8a5a;
    --pattern: rgba(12, 59, 43, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #06140f;
      --chat: #0a1b14;
      --surface: #0d211a;
      --ink: #e9f5ee;
      --muted: #9db8ab;
      --faint: #6b857b;
      --line: #1c3a2f;
      --bubble-bot: #12291f;
      --danger-bg: #3a1616;
      --danger-ink: #fecaca;
      --link: #6ee7a8;
      --pattern: rgba(198, 244, 50, 0.05);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(60% 50% at 15% 10%, rgba(198, 244, 50, 0.28), transparent 70%),
      radial-gradient(50% 45% at 90% 90%, rgba(15, 138, 90, 0.22), transparent 70%),
      var(--page);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Teléfono ---------- */
  .phone {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--chat);
    overflow: hidden;
  }
  @media (min-width: 560px) {
    .phone {
      height: min(880px, calc(100dvh - 40px));
      border-radius: 44px;
      border: 8px solid var(--forest-700);
      box-shadow: 0 40px 80px -30px rgba(7, 42, 30, 0.65), 0 0 0 1px rgba(7, 42, 30, 0.1);
    }
  }

  /* ---------- Cabecera ---------- */
  .top {
    flex: none;
    background: linear-gradient(160deg, var(--forest-600), var(--forest-800) 60%, var(--forest-900));
    color: #fff;
    padding: max(14px, env(safe-area-inset-top)) 14px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 2;
  }
  .top::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(90% 120% at 100% 0%, rgba(198, 244, 50, 0.16), transparent 60%);
    pointer-events: none;
  }
  .avatar {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--lime);
    color: var(--forest-900);
    display: grid;
    place-items: center;
    position: relative;
  }
  .avatar::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #25d366;
    border: 2px solid var(--forest-700);
  }
  .who { min-width: 0; flex: 1; line-height: 1.2; position: relative; z-index: 1; }
  .who strong { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; }
  .who small { display: block; font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-top: 2px; transition: color 0.2s; }
  .who small.typing { color: var(--lime); }
  .verified { color: var(--lime); flex: none; }
  .icon-btn {
    position: relative;
    z-index: 1;
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.18); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn[aria-expanded="true"] { background: var(--lime); color: var(--forest-900); }

  /* ---------- Ajustes (número de prueba) ---------- */
  .settings {
    flex: none;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.25s ease;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    z-index: 1;
  }
  .settings.open { grid-template-rows: 1fr; }
  .settings > div { overflow: hidden; }
  .settings-inner { padding: 14px 16px 16px; }
  .settings label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .settings input {
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--chat);
    color: var(--ink);
    border-radius: 14px;
    padding: 10px 14px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
  }
  .settings input:focus { outline: none; border-color: var(--forest-700); box-shadow: 0 0 0 4px rgba(198, 244, 50, 0.4); }
  .settings p { margin: 8px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--faint); }

  /* ---------- Conversación ---------- */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scroll-behavior: smooth;
    background-image: radial-gradient(var(--pattern) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
    overscroll-behavior: contain;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  .day {
    align-self: center;
    margin: 4px 0 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    box-shadow: 0 1px 2px rgba(7, 42, 30, 0.08);
  }

  .row { display: flex; flex-direction: column; max-width: 84%; animation: pop 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.bot, .row.error { align-self: flex-start; align-items: flex-start; }
  .row.user { margin-top: 4px; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }

  .bubble {
    position: relative;
    padding: 9px 13px 7px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 1px 1.5px rgba(7, 42, 30, 0.12);
  }
  .bubble.bot { background: var(--bubble-bot); border-top-left-radius: 5px; }
  .bubble.user { background: var(--bubble-user); color: var(--forest-900); border-top-right-radius: 5px; font-weight: 500; }
  .bubble.error { background: var(--danger-bg); color: var(--danger-ink); border-top-left-radius: 5px; }
  .bubble strong { font-weight: 800; }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: rgba(12, 59, 43, 0.08); padding: 1px 5px; border-radius: 6px; }

  .meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 3px;
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--faint);
    user-select: none;
  }
  .bubble.user .meta { color: rgba(10, 42, 30, 0.6); }
  .ticks { color: var(--forest-600); display: inline-flex; }

  /* comandos tocables dentro de la respuesta del bot */
  .cmd {
    display: inline-flex;
    align-items: center;
    margin: 1px 0;
    padding: 1px 9px;
    border-radius: 999px;
    border: 1.5px solid var(--forest-700);
    background: transparent;
    color: var(--forest-700);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .cmd:hover { background: var(--forest-700); color: var(--lime); }
  @media (prefers-color-scheme: dark) {
    .cmd { border-color: var(--lime); color: var(--lime); }
    .cmd:hover { background: var(--lime); color: var(--forest-900); }
  }

  /* links a deals */
  .link-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 6px 0 2px;
    padding: 10px 12px;
    border-radius: 14px;
    background: var(--forest-700);
    color: #fff !important;
    text-decoration: none;
    font-weight: 700;
    font-size: 13.5px;
    white-space: normal;
  }
  .link-card small { display: block; font-weight: 500; opacity: 0.7; font-size: 11px; }
  .link-card span.arrow { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--lime); color: var(--forest-900); }

  /* evidencia simulada */
  .photo {
    width: 190px;
    height: 120px;
    border-radius: 12px;
    margin-bottom: 6px;
    background:
      radial-gradient(70% 90% at 80% 10%, rgba(198, 244, 50, 0.55), transparent 60%),
      linear-gradient(150deg, var(--forest-600), var(--forest-900));
    display: grid;
    place-items: center;
    color: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    font-weight: 700;
    gap: 4px;
    text-align: center;
    align-content: center;
  }

  .retry {
    margin-top: 6px;
    border: 0;
    border-radius: 999px;
    padding: 5px 12px;
    background: var(--danger-ink);
    color: var(--danger-bg);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  /* escribiendo… */
  .typing-bubble { display: flex; gap: 4px; align-items: center; padding: 13px 15px; }
  .typing-bubble i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: dot 1.1s infinite ease-in-out; }
  .typing-bubble i:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* ---------- Respuestas rápidas ---------- */
  .quick {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 8px 14px 4px;
    overflow-x: auto;
    scrollbar-width: none;
    background: linear-gradient(to bottom, transparent, var(--chat) 30%);
  }
  .quick::-webkit-scrollbar { display: none; }
  .quick button {
    flex: none;
    border: 1.5px solid var(--forest-700);
    background: var(--surface);
    color: var(--forest-700);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .quick button:hover { background: var(--forest-700); color: var(--lime); }
  .quick button:active { transform: scale(0.96); }
  .quick button:disabled { opacity: 0.5; cursor: default; }
  @media (prefers-color-scheme: dark) {
    .quick button { border-color: var(--line); color: var(--ink); }
    .quick button:hover { background: var(--lime); color: var(--forest-900); border-color: var(--lime); }
  }

  /* ---------- Entrada ---------- */
  .composer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px max(12px, env(safe-area-inset-bottom));
    background: var(--chat);
  }
  .composer input {
    flex: 1;
    min-width: 0;
    border: 1.5px solid transparent;
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 13px 18px;
    font: inherit;
    font-size: 15px;
    box-shadow: 0 1px 2px rgba(7, 42, 30, 0.08);
  }
  .composer input::placeholder { color: var(--faint); }
  .composer input:focus { outline: none; border-color: var(--forest-700); box-shadow: 0 0 0 4px rgba(198, 244, 50, 0.4); }
  .send {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 0;
    background: var(--forest-700);
    color: var(--lime);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s, opacity 0.15s;
  }
  .send:hover { background: var(--forest-600); }
  .send:active { transform: scale(0.92); }
  .send:disabled { opacity: 0.4; cursor: default; transform: none; }

  button:focus-visible, a:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <main class="phone" aria-label="Chat de prueba con el bot de Verify">
    <header class="top">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5.5c0 4.2 2.8 7.6 7 9.5 4.2-1.9 7-5.3 7-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
      </div>
      <div class="who">
        <strong>
          Verify Bot
          <svg class="verified" viewBox="0 0 24 24" width="16" height="16" aria-label="Cuenta verificada" role="img"><path fill="currentColor" d="M12 2l2.4 1.8 3-.2 1 2.8 2.5 1.7-.8 2.9.8 2.9-2.5 1.7-1 2.8-3-.2L12 22l-2.4-1.8-3 .2-1-2.8L3.1 15.9l.8-2.9-.8-2.9 2.5-1.7 1-2.8 3 .2z"/><path d="m8.5 12 2.4 2.4 4.6-4.8" fill="none" stroke="#072a1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </strong>
        <small id="status">en línea · modo simulado</small>
      </div>
      <button class="icon-btn" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings" aria-label="Ajustes de prueba">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <section class="settings" id="settings" aria-label="Ajustes de prueba">
      <div>
        <div class="settings-inner">
          <label for="phone">Número de prueba</label>
          <input id="phone" type="text" inputmode="tel" value="+51999999999" autocomplete="off" />
          <p>Modo simulado: no manda mensajes reales, corre contra el backend real.</p>
        </div>
      </div>
    </section>

    <div class="log" id="log" role="log" aria-live="polite"></div>

    <div class="quick" id="quick" aria-label="Respuestas rápidas"></div>

    <form class="composer" id="form" autocomplete="off">
      <input id="text" type="text" placeholder="Escribe un mensaje…" aria-label="Mensaje" enterkeyhint="send" />
      <button class="send" id="send" type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </main>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const textInput = document.getElementById("text");
  const phoneInput = document.getElementById("phone");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const settingsBtn = document.getElementById("settingsBtn");
  const settingsEl = document.getElementById("settings");
  const quickEl = document.getElementById("quick");
  const FRONTEND_URL = "https://frontend-gilt-pi-76.vercel.app";
  const STATUS_IDLE = "en línea · modo simulado";

  let busy = false;

  try {
    const saved = localStorage.getItem("verify_demo_phone");
    if (saved) phoneInput.value = saved;
  } catch {}
  phoneInput.addEventListener("change", () => {
    try { localStorage.setItem("verify_demo_phone", phoneInput.value.trim()); } catch {}
  });

  settingsBtn.addEventListener("click", () => {
    const open = settingsEl.classList.toggle("open");
    settingsBtn.setAttribute("aria-expanded", String(open));
    if (open) phoneInput.focus();
  });

  const quickActions = [
    { label: "/crear_deal", send: () => ({ text: "/crear_deal" }) },
    { label: "/pagar", send: () => ({ text: "/pagar" }) },
    { label: "📷 Enviar foto", display: "📷 Foto de evidencia", photo: true, send: () => ({ mediaId: "foto_demo_" + Date.now() }) },
    { label: "/arbitrar", send: () => ({ text: "/arbitrar" }) },
    { label: "/mis_deals", send: () => ({ text: "/mis_deals" }) },
    { label: "/ayuda", send: () => ({ text: "/ayuda" }) },
  ];

  for (const action of quickActions) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = action.label;
    btn.addEventListener("click", () =>
      sendMessage(action.send(), { display: action.display || action.label, photo: action.photo })
    );
    quickEl.appendChild(btn);
  }

  const TICKS =
    '<span class="ticks" aria-label="Entregado"><svg viewBox="0 0 20 12" width="16" height="10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1 6.5 3.5 3.5L11 2.5M8 9.5l1 .8L15.5 2.5"/></svg></span>';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function now() {
    return new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
  }

  function scrollDown() {
    requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  }

  // texto del bot -> HTML seguro: links de deals, *negrita*, `código` y /comandos tocables
  function formatBot(text) {
    let html = escapeHtml(text);

    // convierte "https://.../deals/<id>" (o el placeholder verify.app/deals/<id>) en una tarjeta de link real
    html = html.replace(
      /(?:https?:\/\/[^\s]*)?verify\.app\/deals\/([a-f0-9-]+)|(https?:\/\/frontend[^\s]*\/deals\/[a-f0-9-]+)/gi,
      (match, idFromPlaceholder) => {
        const url = idFromPlaceholder ? `${FRONTEND_URL}/deals/${idFromPlaceholder}` : match;
        return (
          `<a class="link-card" href="${url}" target="_blank" rel="noopener">` +
          `<div>Abrir trato<small>${url.replace(/^https?:\/\//, "")}</small></div>` +
          `<span class="arrow"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>`
        );
      }
    );

    html = html
      .replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/(^|\s)(\/[a-z_]+)(?![\w/])/gi, '$1<button type="button" class="cmd" data-cmd="$2">$2</button>');
    return html;
  }

  function addRow(kind, innerHtml, { retry } = {}) {
    const row = document.createElement("div");
    row.className = "row " + kind;
    const bubble = document.createElement("div");
    bubble.className = "bubble " + kind;
    bubble.innerHTML =
      innerHtml + `<div class="meta"><span>${now()}</span>${kind === "user" ? TICKS : ""}</div>`;
    row.appendChild(bubble);
    if (retry) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "retry";
      btn.textContent = "Reintentar";
      btn.addEventListener("click", () => {
        row.remove();
        retry();
      });
      bubble.insertBefore(btn, bubble.querySelector(".meta"));
    }
    log.appendChild(row);
    scrollDown();
    return row;
  }

  function addUser(text, photo) {
    const body = photo
      ? `<div class="photo"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.2"/></svg>Foto de evidencia</div>`
      : escapeHtml(text);
    addRow("user", body);
  }

  function setTyping(on) {
    const existing = document.getElementById("typing");
    if (on && !existing) {
      const row = document.createElement("div");
      row.className = "row bot";
      row.id = "typing";
      row.innerHTML = '<div class="bubble bot typing-bubble" aria-label="Escribiendo"><i></i><i></i><i></i></div>';
      log.appendChild(row);
      scrollDown();
    } else if (!on && existing) {
      existing.remove();
    }
    statusEl.textContent = on ? "escribiendo…" : STATUS_IDLE;
    statusEl.classList.toggle("typing", on);
  }

  function setBusy(on) {
    busy = on;
    sendBtn.disabled = on;
    quickEl.querySelectorAll("button").forEach((b) => (b.disabled = on));
  }

  async function sendMessage(payload, { display, photo } = {}) {
    const from = phoneInput.value.trim();
    if (!from || busy) {
      if (!from) {
        settingsEl.classList.add("open");
        settingsBtn.setAttribute("aria-expanded", "true");
        phoneInput.focus();
      }
      return;
    }
    addUser(display || payload.text, photo);
    setBusy(true);
    setTyping(true);

    try {
      const res = await fetch("/dev/simulate-message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from, ...payload }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error del bot");
      // pequeña pausa para que el "escribiendo…" se sienta natural
      await new Promise((r) => setTimeout(r, 350));
      setTyping(false);
      addRow("bot", formatBot(data.reply));
    } catch (err) {
      setTyping(false);
      addRow("error", escapeHtml("No pude comunicarme con el bot. " + err.message), {
        retry: () => {
          // quita la burbuja del usuario duplicada: el reintento la vuelve a crear
          const rows = log.querySelectorAll(".row.user");
          rows[rows.length - 1]?.remove();
          sendMessage(payload, { display, photo });
        },
      });
    } finally {
      setBusy(false);
      if (matchMedia("(hover: hover)").matches) textInput.focus();
    }
  }

  // comandos tocables dentro de las respuestas del bot
  log.addEventListener("click", (e) => {
    const cmd = e.target.closest?.(".cmd");
    if (cmd) sendMessage({ text: cmd.dataset.cmd }, { display: cmd.dataset.cmd });
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text) return;
    textInput.value = "";
    sendMessage({ text });
  });

  // saludo inicial
  const dayChip = document.createElement("div");
  dayChip.className = "day";
  dayChip.textContent = "Hoy";
  log.appendChild(dayChip);

  addRow(
    "bot",
    formatBot(
      "Hola, soy el bot de *Verify* 👋\nTu garantía para cobrar y pagar sin riesgo.\n\nToca un comando para empezar:\n/crear_deal - crear un nuevo trato\n/pagar - confirmar el pago del trato activo (simulado)\n/arbitrar - evaluar la evidencia y liberar el pago\n/mis_deals - ver tus tratos\n/ayuda - ver esta ayuda"
    )
  );
</script>
</body>
</html>
